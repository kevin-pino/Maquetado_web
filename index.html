<!DOCTYPE html>


<!--Ese código es la estructura básica de una página web en HTML.

HTML (HyperText Markup Language) es el lenguaje que se usa para crear la estructura de las páginas web. No es programación como tal, sino un lenguaje de marcado (usa etiquetas).  -->





<html lang="en">
<!-- Es la etiqueta raíz (la principal de todo el documento)

Todo el contenido va dentro de <html>
lang="en" indica el idioma (en este caso, inglés) -->

<head>
  <!-- Contiene información interna de la página (no visible directamente)

Aquí van cosas como:

configuración
título
enlaces a estilos (CSS)
scripts -->
  <meta charset="UTF-8">
  <!-- Contiene información interna de la página (no visible directamente)

Aquí van cosas como:

configuración
título
enlaces a estilos (CSS)
scripts -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace que la página sea responsive (adaptable a celulares)

✔ Ajusta el ancho al tamaño del dispositivo
✔ Muy importante hoy en día -->
  <title>Document</title>
  <!--Es el título de la página

✔ Aparece en la pestaña del navegador
✔ También lo usan los buscadores (SEO)  -->
</head>
<body>
  <!-- Aquí va TODO lo visible de la página -->
  
</body>
</html>
